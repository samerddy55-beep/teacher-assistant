<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد المعلم</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f3f6fb;color:#1b2a41}
header{background:#1d4e89;color:#fff;padding:14px;text-align:center;font-size:20px}
main{max-width:800px;margin:auto;padding:12px}
#chat{background:#fff;border-radius:10px;padding:12px;min-height:50vh;max-height:60vh;overflow-y:auto}
.msg{margin:8px 0;padding:10px;border-radius:10px;white-space:pre-wrap;line-height:1.8}
.user{background:#dbe9ff}
.bot{background:#eef7ee}
.row{display:flex;gap:8px;margin-top:10px}
textarea{flex:1;padding:10px;border-radius:8px;border:1px solid #bbb;font-size:16px;font-family:inherit}
button{background:#1d4e89;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
button.alt{background:#5b7fa8;padding:8px 12px;font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
</style>
</head>
<body>
<header>🎓 مساعد المعلم</header>
<main>
  <div class="quick">
    <button class="alt" onclick="tpl('حضّر لي درس [اسم الدرس] لصف [الصف] مادة [المادة]، مدة الحصة 45 دقيقة.')">تحضير درس</button>
    <button class="alt" onclick="tpl('اعمل لي امتحان [عدد] علامة على درس [اسم الدرس] لصف [الصف] مع نموذج الإجابة وسلم العلامات.')">امتحان</button>
    <button class="alt" onclick="tpl('اعمل لي خطة فصلية لمادة [المادة] لصف [الصف].')">خطة فصلية</button>
    <button class="alt" onclick="tpl('اعمل لي ورقة عمل على درس [اسم الدرس] لصف [الصف].')">ورقة عمل</button>
  </div>

  <div id="chat"></div>

  <div class="row">
    <textarea id="q" rows="3" placeholder="اكتب طلبك هنا..."></textarea>
    <button onclick="go()">إرسال</button>
  </div>
  <p style="text-align:center"><button class="alt" onclick="resetChat()">محادثة جديدة</button></p>
</main>

<script>
let history = [];
const chat = document.getElementById("chat");

function tpl(t){ document.getElementById("q").value = t; }
function resetChat(){ history = []; chat.innerHTML = ""; }
function add(role, text){
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function go(){
  const q = document.getElementById("q");
  const t = q.value.trim();
  if(!t) return;
  q.value = "";
  send(t);
}
async function send(text){
  add("user", text);
  history.push({role:"user", content:text});
  const out = add("bot", "...");
  let full = "";
  try{
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ messages: history.slice(-12) })
    });
    if(!r.ok){
      out.textContent = "خطأ " + r.status + ": انتظر دقيقة وحاول مرة ثانية.";
      history.pop(); return;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const l of lines){
        if(!l.startsWith("data: ")) continue;
        const p = l.slice(6).trim();
        if(p === "[DONE]") continue;
        try{
          const j = JSON.parse(p);
          full += j.choices[0].delta.content || "";
          out.textContent = full;
          chat.scrollTop = chat.scrollHeight;
        }catch(e){}
      }
    }
    history.push({role:"assistant", content:full});
  }catch(e){
    out.textContent = "تعذر الاتصال: " + e.message;
    history.pop();
  }
}
</script>
</body>
</html>
